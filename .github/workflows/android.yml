name: Android

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*", "*.*.*"]
  release:
    types: [published]
  pull_request:
  # So a build can be produced on demand without pushing a commit.
  workflow_dispatch:

permissions:
  contents: write # needed to publish the release the APK is attached to

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # NDK r27+ is required for 16 KB page alignment on Android 15.
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # -PrustRelease builds the packaged Rust core with the release profile:
      # stripped and size-optimised. Without it the three unstripped ABI
      # libraries make the APK ~95 MB, which is absurd for a share-sheet
      # utility. The APK stays debug-*signed*, so it still installs with no
      # keystore setup.
      - run: ./gradlew assembleDebug -PrustRelease

      # Publish the build BEFORE running the checks. A failing assertion should
      # not cost you an installable APK that compiled perfectly well.
      #
      # Debug-signed, so it installs straight from a phone without any
      # keystore secrets.
      - name: Collect the APK
        run: |
          mkdir -p artifacts
          # One flavor now, so exactly one APK. Named with the short SHA so a
          # downloaded file still says which commit it came from.
          apk=$(find app/build/outputs/apk -name '*-debug.apk' | head -1)
          test -n "$apk" || { echo "no APK produced"; exit 1; }
          cp "$apk" "artifacts/sharewhere-${GITHUB_SHA::7}.apk"
          ls -la artifacts
          {
            echo "### APK"
            for f in artifacts/*.apk; do
              echo "- \`$(basename "$f")\` — $(du -h "$f" | cut -f1)"
              echo "  sha256 \`$(sha256sum "$f" | cut -d' ' -f1)\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: sharewhere-apk-${{ github.sha }}
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      # --- publishing -------------------------------------------------------
      #
      # Workflow-run artifacts need a GitHub login to download and are tied to
      # one run, which makes them a poor thing to hand someone. A single
      # always-replaced pre-release gives one stable, bookmarkable URL that
      # works for anyone:
      #
      #   https://github.com/phrag/ShareWhere/releases/download/dev-build/sharewhere-dev.apk

      - name: Name the dev APK
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        run: cp artifacts/*.apk sharewhere-dev.apk

      - name: Publish the dev build
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-build
          name: "ShareWhere dev build (latest)"
          body: |
            Rebuilt and replaced on every push to `main` or a `claude/**` branch.
            Not a stable release — this is in-progress work.

            **[sharewhere-dev.apk](https://github.com/phrag/ShareWhere/releases/download/dev-build/sharewhere-dev.apk)**
            — that link always serves the newest build, so it is safe to bookmark.

            Debug-signed, so it installs without any keystore setup. It will not
            upgrade over a release-signed build later.

            Branch: `${{ github.ref_name }}`
            Commit: ${{ github.sha }}
          prerelease: true
          files: sharewhere-dev.apk

      - name: Name the release APK
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp artifacts/*.apk "sharewhere-${VERSION}.apk"

      - name: Extract release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Everything under "## <version>" up to the next "## " heading.
          awk -v hdr="## $VERSION" '
            !grab {
              if (substr($0, 1, length(hdr)) == hdr) {
                rest = substr($0, length(hdr) + 1)
                if (rest == "" || rest ~ /^[ \t\r]/) { grab = 1; next }
              }
            }
            grab && /^## / { exit }
            grab { print }
          ' CHANGELOG.md > release-notes.md
          # A version with no CHANGELOG section still gets a usable body.
          if [ ! -s release-notes.md ]; then
            echo "ShareWhere ${VERSION}" > release-notes.md
          fi
          cat release-notes.md

      - name: Attach the APK to the release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: sharewhere-*.apk

      # The manifest may declare INTERNET and nothing else. A dependency
      # that drags in location, storage or contacts fails here.
      - run: ./gradlew verifyDeclaredPermissions

      # JVM tests run against the host-built .so, so binding drift is caught in
      # seconds without an emulator.
      - run: ./gradlew test

      - run: ./gradlew lint

  instrumentation:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        api-level: [30, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      - run: cargo install cargo-ndk --locked

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          script: ./gradlew connectedDebugAndroidTest
