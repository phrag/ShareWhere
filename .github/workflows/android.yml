name: Android

on:
  push:
    paths-ignore: ["rust/testdata/**", "*.md"]
  pull_request:
  # So a build can be produced on demand without pushing a commit.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # NDK r27+ is required for 16 KB page alignment on Android 15.
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - run: ./gradlew assembleOfflineDebug assembleStandardDebug

      # The core product claim, asserted rather than promised: the offline
      # flavor's merged manifest must declare no permissions at all.
      - run: ./gradlew verifyOfflineFlavorHasNoPermissions

      # JVM tests run against the host-built .so, so binding drift is caught in
      # seconds without an emulator.
      - run: ./gradlew test

      - run: ./gradlew lint

      # Debug-signed, so they install straight from a phone without any
      # keystore secrets. `offline` is the one to install: no permissions at
      # all. `standard` adds INTERNET for short-link expansion.
      - name: Collect APKs
        run: |
          mkdir -p artifacts
          find app/build/outputs/apk -name '*.apk' -exec cp {} artifacts/ \;
          ls -la artifacts
          echo "### APKs" >> "$GITHUB_STEP_SUMMARY"
          for f in artifacts/*.apk; do
            echo "- \`$(basename "$f")\` — $(du -h "$f" | cut -f1), sha256 \`$(sha256sum "$f" | cut -c1-16)…\`" \
              >> "$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: sharewhere-apks-${{ github.sha }}
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

  instrumentation:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        api-level: [30, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      - run: cargo install cargo-ndk --locked

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          script: ./gradlew connectedOfflineDebugAndroidTest
