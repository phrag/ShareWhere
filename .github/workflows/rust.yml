name: Rust

on:
  push:
    paths: ["rust/**", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["rust/**", ".github/workflows/rust.yml"]

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: rust

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

      # Unit tests, the golden corpus, the property invariants, and the
      # conformance test that every catalog regex still compiles under the Rust
      # regex crate. That last one is the guard against upstream introducing a
      # lookahead and silently disabling a rule.
      - run: cargo test --workspace

      # The Kotlin bindings must actually generate. A record field renamed in
      # Rust breaks the app at runtime otherwise.
      - run: cargo build -p sharewhere-ffi --features bindgen --bin uniffi-bindgen
      - run: |
          cargo build -p sharewhere-ffi
          ./target/debug/uniffi-bindgen generate \
            --library target/debug/libsharewhere.so \
            --language kotlin --out-dir /tmp/bindings --no-format
          test -s /tmp/bindings/uniffi/sharewhere/sharewhere.kt

  android-target:
    name: cross-compile for Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # 16 KB pages are mandatory on Android 15+; without this flag the app
      # installs nowhere new and the error says nothing useful.
      - run: cargo check -p sharewhere-ffi --target aarch64-linux-android
        env:
          RUSTFLAGS: "-C link-arg=-Wl,-z,max-page-size=16384"

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: rust/Cargo.toml
