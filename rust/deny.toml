[graph]
targets = [
    { triple = "aarch64-linux-android" },
    { triple = "armv7-linux-androideabi" },
    { triple = "x86_64-linux-android" },
    { triple = "x86_64-unknown-linux-gnu" },
]

[advisories]
yanked = "deny"
ignore = [
    # basic-toml is flagged unmaintained, not vulnerable. It reaches the graph
    # only through askama_derive, which uniffi's binding generator (the
    # `bindgen` feature of sharebear-ffi) uses at build time; nothing in the
    # shipped library parses TOML with it. The latest askama_derive (0.16.1)
    # and uniffi_bindgen (0.32.2) still depend on it, so there is no upgrade
    # to take yet. Revisit when uniffi moves to an askama without basic-toml.
    { id = "RUSTSEC-2026-0374", reason = "unmaintained build-time-only dependency of uniffi bindgen via askama_derive; no maintained alternative upstream yet" },
]

[licenses]
# ShareBear is GPL-3.0-or-later. LGPL-3.0 is here for the vendored ClearURLs
# catalog; everything else must be permissive so the combined work stays
# distributable.
#
# The `-or-later` variants are load-bearing, not belt and braces: SPDX treats
# `GPL-3.0-or-later` as a distinct identifier from `GPL-3.0`, so listing only
# the latter makes cargo-deny reject our own workspace crates.
allow = [
    "GPL-3.0-or-later",
    "GPL-3.0",
    "LGPL-3.0-or-later",
    "LGPL-3.0",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
]
confidence-threshold = 0.9

# The allow-list above is a policy statement about what may enter the tree, so
# entries that nothing currently uses are expected rather than a problem.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
# Nothing in the core may reach the network. If an HTTP client ever appears in
# this dependency graph, something has gone badly wrong -- transport belongs in
# the Kotlin `core-net` module, behind the policy the core hands it.
deny = [
    { name = "reqwest" },
    { name = "hyper" },
    { name = "ureq" },
    { name = "curl" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
